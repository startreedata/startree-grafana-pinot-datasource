name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

run-name: Release (${{ inputs.version_bump }}) from ${{ github.ref_name }} by @${{ github.actor }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        run: yarn run test:ci

      - name: Run backend tests
        run: go test ./...

  release:
    name: Build & Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          git config --global user.email "ci@startree.ai"
          git config --global user.name "CI"
          version=$(npm version ${{ inputs.version_bump }})
          git push --follow-tags
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build and sign plugin
        uses: grafana/plugin-actions/build-plugin@main
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN_FOR_SIGNING }}
          attestation: true
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}

      - name: Prepare next development version
        run: |
          git pull --rebase
          npm version --no-git-tag-version prerelease --preid pre
          git add package.json
          git commit -m 'Prepare for next development version'
          git push
