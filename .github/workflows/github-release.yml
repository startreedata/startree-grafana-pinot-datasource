name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and validate immutable source without creating a release
        type: boolean
        default: false
      validation_sha:
        description: Full 40-character source commit SHA (required for validation only)
        type: string
        default: ''
      attest_candidate:
        description: Attest a successful v1.1.2 candidate from current main (requires validation only)
        type: boolean
        default: false
      version_bump:
        description: Version bump type
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
      skip_e2e:
        description: Skip E2E tests
        type: boolean
        default: false

run-name: Release (${{ inputs.version_bump }}) from ${{ github.ref_name }} by @${{ github.actor }}

# Default least privilege for all jobs; the release job below grants the extra
# write scopes it needs (id-token / contents / attestations).
permissions: read-all

jobs:
  test_frontend:
    name: Test Frontend
    if: ${{ !inputs.validate_only && !inputs.attest_candidate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        run: yarn run test:ci

  test_backend:
    name: Test Backend
    if: ${{ !inputs.validate_only && !inputs.attest_candidate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: repo.startreedata.io/startree-docker-registry
          username: ${{ secrets.MVN_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.MVN_ARTIFACTORY_TOKEN }}

      - name: Start Pinot
        run: docker compose up pinot --quiet-pull --detach

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - name: Setup Pinot
        run: go run cmd/testsetup/main.go

      - name: Run backend tests
        run: go test -p 1 -v ./...

      - name: Collect Pinot logs
        if: ${{ failure() }}
        run: docker compose logs pinot > pinot.log

      - name: Upload Pinot logs
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: pinot-logs
          path: pinot.log
          retention-days: 30

  build_plugin:
    name: Build Plugin
    if: ${{ !inputs.validate_only && !inputs.attest_candidate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - run: go run cmd/release/main.go build_backend
      - run: yarn install --frozen-lockfile
      - run: yarn run build

      - run: tar cf dist.tar dist

      - name: Upload plugin
        uses: actions/upload-artifact@v6
        with:
          name: dist.tar
          path: dist.tar
          retention-days: 1

  end_to_end:
    name: Test E2E
    if: ${{ !inputs.validate_only && !inputs.attest_candidate && !inputs.skip_e2e }}
    runs-on: ubuntu-latest
    needs: [build_plugin]
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          registry: repo.startreedata.io/startree-docker-registry
          username: ${{ secrets.MVN_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.MVN_ARTIFACTORY_TOKEN }}

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Download plugin
        uses: actions/download-artifact@v7
        with:
          name: dist.tar

      - run: tar xf dist.tar

      - name: Pull Pinot image
        # The startree-pinot image is large; pull it in a dedicated, bounded step so a slow
        # download is easy to spot and can't creep toward GitHub's 6h job ceiling.
        timeout-minutes: 25
        run: docker compose pull pinot

      - name: Start Pinot and Grafana
        run: docker compose up pinot grafana --detach --quiet-pull

      - name: Wait for Pinot components
        timeout-minutes: 12
        run: |
          # The StarTree quickstart runs the controller, broker and server inside the single
          # `pinot` container (it doesn't start a standalone minion worker). Poll each until
          # ready; fail fast if the container dies instead of polling for the full timeout.
          wait_for() {
            local name="$1" cmd="$2"
            for i in $(seq 1 120); do
              if eval "$cmd" >/dev/null 2>&1; then echo "ready: $name"; return 0; fi
              if [ "$(docker inspect -f '{{.State.Running}}' pinot 2>/dev/null)" != "true" ]; then
                echo "pinot container is not running"; docker compose logs pinot; exit 1
              fi
              echo "waiting for $name ($i)"; sleep 5
            done
            echo "timed out waiting for $name"; docker compose logs pinot; exit 1
          }
          wait_for "controller" "curl -sf http://localhost:9000/health"
          wait_for "broker"     "curl -sf http://localhost:8000/health"
          wait_for "server"     "curl -sf http://localhost:9000/instances | grep -q Server_"
          wait_for "grafana"    "curl -sf http://localhost:3000/api/health"

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - name: Create E2E test tables (nginxLogs, highCardinality, partial, ...)
        # Same fixtures the backend tests use; the E2E specs query these too.
        run: go run cmd/testsetup/main.go

      - name: Create E2E fixture tables (complex_website, simple_website)
        # The PROMQL quickstart doesn't ship the website tables the E2E specs query, so
        # generate + load them with pinot-tools' synthetic data generator (bundled in the
        # image). See tests/setup-pinot-tables.sh.
        timeout-minutes: 10
        run: bash tests/setup-pinot-tables.sh pinot

      - name: Install Playwright Browsers
        run: yarn install --frozen-lockfile && yarn playwright install --with-deps chromium

      - name: Run Playwright tests
        timeout-minutes: 25
        # github reporter -> inline annotations in the step log; html -> the
        # playwright-report/ artifact uploaded below (useful for debugging failures).
        run: yarn playwright test --reporter=github,html
        env:
          # Grafana resolves these URLs from inside the compose network (service name `pinot`).
          # Local StarTree quickstart is unauthenticated, so database/token are empty.
          PINOT_CONNECTION_CONTROLLER_URL: http://pinot:9000
          PINOT_CONNECTION_BROKER_URL: http://pinot:8000
          PINOT_CONNECTION_DATABASE: ''
          PINOT_CONNECTION_AUTH_TOKEN: ''

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Test Results (videos, traces, screenshots)
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          # test-results/ only exists when a test fails (retain-on-failure); a green run
          # leaves it empty, so don't warn when there's nothing to upload.
          if-no-files-found: ignore

      - name: Collect Grafana logs
        if: ${{ failure() }}
        run: docker compose logs grafana > grafana.log

      - name: Upload Grafana logs
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: grafana-logs
          path: grafana.log
          retention-days: 30

      - name: Collect Pinot logs
        if: ${{ failure() }}
        run: docker compose logs pinot > pinot.log

      - name: Upload Pinot logs
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: pinot-logs-e2e
          path: pinot.log
          retention-days: 30

  release:
    name: Build & Release
    needs: [test_frontend, test_backend, build_plugin, end_to_end]
    if: ${{ !inputs.validate_only && !inputs.attest_candidate && !cancelled() && needs.test_frontend.result == 'success' && needs.test_backend.result == 'success' && needs.build_plugin.result == 'success' && (needs.end_to_end.result == 'success' || (inputs.skip_e2e && needs.end_to_end.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version
        id: version
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          git config --global user.email "ci@startree.ai"
          git config --global user.name "CI"
          if [ "$BRANCH_NAME" = "main" ]; then
            version=$(npm version "$VERSION_BUMP")
            git push --follow-tags
          else
            sanitized_branch=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
            current_version=$(node -p "require('./package.json').version.split(/[+-]/)[0]")
            npm version --no-git-tag-version --allow-same-version "$current_version"
            npm version --no-git-tag-version "$VERSION_BUMP"
            base_version=$(node -p "require('./package.json').version")
            npm version --no-git-tag-version "${base_version}-branch-${sanitized_branch:-branch}"
            version="v$(node -p "require('./package.json').version")"
            git add package.json
            git commit -m "$version"
            git tag -a "$version" -m "$version"
            git push origin HEAD "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build backend
        run: go run cmd/release/main.go build_backend

      - name: Build frontend
        run: yarn run build

      - name: Get plugin metadata
        id: metadata
        run: |
          GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip" >> $GITHUB_OUTPUT
          echo "archive-sha1sum=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip.sha1" >> $GITHUB_OUTPUT

      - name: Sign plugin
        run: yarn run sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN_FOR_SIGNING }}

      - name: Package plugin
        run: |
          mv dist ${{ steps.metadata.outputs.plugin-id }}
          zip ${{ steps.metadata.outputs.archive }} ${{ steps.metadata.outputs.plugin-id }} -r
          sha1sum ${{ steps.metadata.outputs.archive }} | cut -f1 -d' ' > ${{ steps.metadata.outputs.archive-sha1sum }}

      - name: Validate plugin
        run: npx -y @grafana/plugin-validator@latest -sourceCodeUri file://./ ${{ steps.metadata.outputs.archive }}

      - name: Generate artifact attestation
        id: attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.metadata.outputs.archive }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./${{ steps.metadata.outputs.archive }}
            ./${{ steps.metadata.outputs.archive-sha1sum }}

      # Intentionally no post-release "prepare for next development version" step.
      # plugin.json's version is resolved from package.json at webpack build time via the
      # %VERSION% placeholder, so a prerelease bump on main between releases creates a
      # version on main for which no plugin.json or built artifact exists. The Grafana
      # plugin marketplace validator flags this as a packagecode-version-mismatch.
      # Keeping main pinned to the last released version makes the next release's
      # `npm version <bump>` step (above) the single source of truth for version changes.

  validate_only:
    name: Full Grafana Validation (no release)
    if: ${{ inputs.validate_only || inputs.attest_candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VALIDATOR_IMAGE: grafana/plugin-validator-cli@sha256:7c935b2ba3ccc5dfe6fdbec4cb0c1c6a04f7feff93cd4b3d4b6a362a5271996a
    steps:
      - name: Validate source selection
        env:
          VALIDATION_SHA: ${{ inputs.validation_sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          [[ "$VALIDATE_ONLY" == 'true' ]] || { echo 'attest_candidate requires validate_only'; exit 1; }
          [[ "$GITHUB_REPOSITORY" == 'startreedata/startree-grafana-pinot-datasource' ]]
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'validation_sha must be a full commit SHA'; exit 1; }
          mkdir -p "$RUNNER_TEMP/grafana-preflight/evidence/reports" "$RUNNER_TEMP/grafana-preflight/source"
          echo "PREFLIGHT_ROOT=$RUNNER_TEMP/grafana-preflight" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.validation_sha }}
          path: build-source
          persist-credentials: false

      - name: Export immutable source and identity
        id: source
        working-directory: build-source
        env:
          VALIDATION_SHA: ${{ inputs.validation_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$VALIDATION_SHA" ]]
          [[ "$(git status --porcelain)" == '' ]]
          remote_url=$(git config --get remote.origin.url)
          [[ "${remote_url%.git}" == 'https://github.com/startreedata/startree-grafana-pinot-datasource' ]]
          git archive --format=tar HEAD | tar -xf - -C "$PREFLIGHT_ROOT/source"
          git archive --format=tar.gz --output="$PREFLIGHT_ROOT/evidence/source.tar.gz" HEAD
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['PREFLIGHT_ROOT'])
          package = json.loads(pathlib.Path('package.json').read_text())
          plugin = json.loads(pathlib.Path('src/plugin.json').read_text())
          assert plugin['id'] == 'startree-pinot-datasource' and plugin['backend'] is True
          assert plugin['executable'] == 'gpx_pinot' and plugin['info']['version'] == '%VERSION%'
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', package['version'])
          locks = [name for name in ('yarn.lock', 'package-lock.json') if pathlib.Path(name).is_file()]
          assert len(locks) == 1, 'Exactly one supported Node lockfile is required'
          lockfile = locks[0]
          manager = 'npm' if lockfile == 'package-lock.json' else 'yarn'
          if manager == 'npm':
              assert package.get('packageManager') == 'npm@10.8.2'
          else:
              assert re.fullmatch(r'yarn@1\.22\.\d+', package.get('packageManager', ''))
          go_version = re.search(r'^go (\d+\.\d+(?:\.\d+)?)$', pathlib.Path('go.mod').read_text(), re.M).group(1)
          metadata = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'package_version': package['version'], 'plugin_id': plugin['id'],
              'package_manager': manager, 'declared_package_manager': package['packageManager'],
              'node_lockfile': lockfile, 'node_lockfile_sha256': hashlib.sha256(pathlib.Path(lockfile).read_bytes()).hexdigest(),
              'go_mod_version': go_version, 'workflow_sha': os.environ['GITHUB_SHA'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'], 'run_id': os.environ['GITHUB_RUN_ID'],
          }
          (root / 'evidence/source.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'go_version={go_version}', file=output)
              print(f'package_manager={manager}', file=output)
              print(f'lockfile={lockfile}', file=output)
              print(f'version={package["version"]}', file=output)
              print(f'archive={plugin["id"]}-{package["version"]}.zip', file=output)
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: '20.20.2'
          cache: ${{ steps.source.outputs.package_manager }}
          cache-dependency-path: build-source/${{ steps.source.outputs.lockfile }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.source.outputs.go_version }}
          cache-dependency-path: build-source/go.sum

      - name: Verify package manager and install locked frontend dependencies
        working-directory: build-source
        env:
          PACKAGE_MANAGER: ${{ steps.source.outputs.package_manager }}
        run: |
          [[ "$(node --version)" == 'v20.20.2' ]] || { echo 'Unexpected Node version'; exit 1; }
          if [[ "$PACKAGE_MANAGER" == npm ]]; then
            [[ "$(npm --version)" == '10.8.2' ]] || { echo 'Unexpected bundled npm version'; exit 1; }
          fi
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path(os.environ['PREFLIGHT_ROOT']) / 'evidence/source.json'
          metadata = json.loads(path.read_text())
          metadata['package_manager_version'] = subprocess.check_output([os.environ['PACKAGE_MANAGER'], '--version'], text=True).strip()
          metadata['node_version'] = subprocess.check_output(['node', '--version'], text=True).strip()
          path.write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          if [[ "$PACKAGE_MANAGER" == npm ]]; then
            npm ci 2>&1 | tee "$PREFLIGHT_ROOT/evidence/install.log"
          else
            yarn install --frozen-lockfile 2>&1 | tee "$PREFLIGHT_ROOT/evidence/install.log"
          fi

      - name: Verify locked Linux native SWC without a WASM fallback
        if: ${{ steps.source.outputs.package_manager == 'npm' }}
        working-directory: build-source
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const evidence = { platform: process.platform, architecture: process.arch, passed: false };
          let failure;
          try {
            assert.equal(process.platform, 'linux');
            assert.equal(process.arch, 'x64');
            assert.equal(process.env.SWC_BINARY_PATH, undefined, 'SWC_BINARY_PATH must not override the locked binary');
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            const coreLock = lock.packages['node_modules/@swc/core'];
            assert.equal(coreLock.version, '1.6.5');
            const platforms = Object.entries(coreLock.optionalDependencies);
            assert.equal(platforms.length, 10, 'All declared SWC platform packages must be locked');
            evidence.lockedPlatforms = platforms.map(([name, version]) => {
              const entry = lock.packages[`node_modules/${name}`];
              assert.ok(entry, `Missing locked platform ${name}`);
              assert.equal(entry.optional, true, `${name} must remain optional`);
              assert.equal(entry.version, version);
              assert.equal(version, coreLock.version);
              assert.match(entry.integrity, /^sha512-[A-Za-z0-9+/]+={0,2}$/);
              return { name, version, integrity: entry.integrity };
            });
            const nativeName = '@swc/core-linux-x64-gnu';
            const nativeLock = lock.packages[`node_modules/${nativeName}`];
            const corePath = require.resolve('@swc/core/package.json');
            const fromCore = createRequire(corePath);
            const corePackage = JSON.parse(fs.readFileSync(corePath, 'utf8'));
            const nativePackage = JSON.parse(fs.readFileSync(fromCore.resolve(`${nativeName}/package.json`), 'utf8'));
            assert.equal(corePackage.version, coreLock.version);
            assert.equal(nativePackage.name, nativeName);
            assert.equal(nativePackage.version, nativeLock.version);
            const swc = require('@swc/core');
            const metadata = swc.getBinaryMetadata();
            assert.equal(metadata.target, 'x86_64-unknown-linux-gnu');
            const transformed = swc.transformSync('const answer = 40 + 2;', { jsc: { parser: { syntax: 'ecmascript' } } });
            assert.equal(typeof transformed.code, 'string');
            assert.match(transformed.code, /answer/);
            assert.throws(() => fromCore.resolve('@swc/wasm'), error => error.code === 'MODULE_NOT_FOUND', 'No untracked SWC WASM fallback may be installed');
            Object.assign(evidence, {
              version: corePackage.version, nativePackage: nativeName, target: metadata.target,
              lockIntegrity: nativeLock.integrity, transformPassed: true, noWasmFallback: true, passed: true,
            });
          } catch (error) {
            failure = error;
            evidence.error = error.message;
          }
          fs.writeFileSync(path.join(process.env.PREFLIGHT_ROOT, 'evidence/swc-native.json'), JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence, null, 2));
          if (failure) throw failure;
          JS

      - name: Build all backend platforms and production frontend
        working-directory: build-source
        env:
          PACKAGE_MANAGER: ${{ steps.source.outputs.package_manager }}
        run: |
          go run cmd/release/main.go build_backend 2>&1 | tee "$PREFLIGHT_ROOT/evidence/build-backend.log"
          "$PACKAGE_MANAGER" run build 2>&1 | tee "$PREFLIGHT_ROOT/evidence/build-frontend.log"
          git diff --exit-code
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 linux_arm windows_amd64; do
            executable="dist/gpx_pinot_$target"
            if [[ "$target" == windows_* ]]; then executable="$executable.exe"; fi
            [[ -s "$executable" && -x "$executable" ]]
            go version -m "$executable" >> "$PREFLIGHT_ROOT/evidence/backend-build-info.txt"
          done
          { go version; node --version; "$PACKAGE_MANAGER" --version; docker --version; } > "$PREFLIGHT_ROOT/evidence/build-tools.txt"

      - name: Sign plugin
        working-directory: build-source
        run: '"$PACKAGE_MANAGER" run sign 2>&1 | tee "$PREFLIGHT_ROOT/evidence/signing.log"'
        env:
          PACKAGE_MANAGER: ${{ steps.source.outputs.package_manager }}
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN_FOR_SIGNING }}

      - name: Package signed plugin and checksums
        working-directory: build-source
        env:
          ARCHIVE: ${{ steps.source.outputs.archive }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          jq -e --arg version "$VERSION" '.id == "startree-pinot-datasource" and .info.version == $version' dist/plugin.json
          [[ -s dist/MANIFEST.txt ]]
          mkdir -p "$PREFLIGHT_ROOT/package"
          cp -a dist "$PREFLIGHT_ROOT/package/startree-pinot-datasource"
          cp dist/plugin.json "$PREFLIGHT_ROOT/evidence/plugin.json"
          cd "$PREFLIGHT_ROOT/package"
          zip -q -r "$PREFLIGHT_ROOT/evidence/$ARCHIVE" startree-pinot-datasource
          cd "$PREFLIGHT_ROOT/evidence"
          sha1sum "$ARCHIVE" | cut -d' ' -f1 > "$ARCHIVE.sha1"
          sha256sum "$ARCHIVE" | cut -d' ' -f1 > "$ARCHIVE.sha256"
          unzip -t "$ARCHIVE" > archive-integrity.txt

      - name: Pull official validator and record tooling
        run: |
          # Reporting changes only: retain every default rule and severity.
          printf 'global:\n  enabled: true\n  reportAll: true\n' > "$PREFLIGHT_ROOT/evidence/reporting-only.yaml"
          docker pull "$VALIDATOR_IMAGE"
          docker image inspect "$VALIDATOR_IMAGE" --format '{{json .}}' > "$PREFLIGHT_ROOT/evidence/validator-image.json"
          docker run --rm --entrypoint /bin/sh "$VALIDATOR_IMAGE" -ec '
            go version
            semgrep --version
            gosec -version
            govulncheck -version
            clamscan --version
          ' > "$PREFLIGHT_ROOT/evidence/validator-tools.txt" 2>&1

      - name: Run default full Grafana validator
        id: validation
        env:
          ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          set +e
          docker run --rm -e DEBUG=1 \
            -v "$PREFLIGHT_ROOT/source:/source:ro" \
            -v "$PREFLIGHT_ROOT/evidence:/evidence" \
            "$VALIDATOR_IMAGE" \
            -sourceCodeUri file:///source \
            -config /evidence/reporting-only.yaml \
            -output-to-file /evidence/reports/validator.json \
            "/evidence/$ARCHIVE" \
            2>&1 | tee "$PREFLIGHT_ROOT/evidence/reports/validator.log"
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$PREFLIGHT_ROOT/evidence/reports/validator.exit"
          printf '%s\n' "${statuses[1]}" > "$PREFLIGHT_ROOT/evidence/reports/tee.exit"

      - name: Require complete successful security validation
        id: assessment
        if: ${{ always() && steps.validation.outcome == 'success' }}
        env:
          VERSION: ${{ steps.source.outputs.version }}
          NODE_LOCKFILE: ${{ steps.source.outputs.lockfile }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['PREFLIGHT_ROOT']) / 'evidence/reports'
          report = json.loads((root / 'validator.json').read_text())
          assert report['id'] == 'startree-pinot-datasource'
          assert report['version'] == os.environ['VERSION']
          diagnostics = report['plugin-validator']
          assert isinstance(diagnostics, dict)
          errors = []
          for analyzer, findings in diagnostics.items():
              assert isinstance(findings, list)
              for finding in findings:
                  assert isinstance(finding, dict) and isinstance(finding.get('Severity'), str)
                  if finding['Severity'] == 'error' or finding.get('Name') == 'scan-incomplete':
                      errors.append({'analyzer': analyzer, **finding})
          events = []
          osv_scan_errors = []
          for line in (root / 'validator.log').read_text().splitlines():
              prefix = '[DEBUG] osv-scanner returned error (vulnerabilities found): '
              if line.startswith(prefix) and line.removeprefix(prefix) != 'vulnerabilities found':
                  osv_scan_errors.append(line)
              if line.startswith('PLUGIN_VALIDATOR_EVENT '):
                  events.append(json.loads(line.removeprefix('PLUGIN_VALIDATOR_EVENT ')))
          required_analyzers = {'code-rules', 'go-sec', 'govulncheck', 'virusscan', 'osv-scanner'}
          started = {event.get('analyzer') for event in events if event.get('event') == 'analyzer_started'}
          finished = {event.get('analyzer') for event in events if event.get('event') == 'analyzer_finished' and event.get('failed') is False}
          missing = sorted(required_analyzers - (started & finished))
          scanners = {}
          # Exit 1/3 can report findings; error/incomplete diagnostics still reject the run.
          for scanner, (minimum, allowed_exits) in {'semgrep': (1, {0}), 'gosec': (1, {0, 1}), 'govulncheck': (7, {0, 3}), 'clamscan': (2, {0, 1})}.items():
              begun = [event for event in events if event.get('event') == 'scanner_started' and event.get('scanner') == scanner]
              completed = [event for event in events if event.get('event') == 'scanner_finished' and event.get('scanner') == scanner and event.get('exit_code') in allowed_exits]
              scanners[scanner] = {'started': len(begun), 'completed': len(completed), 'required': minimum}
          osv_results = diagnostics.get('osv-scanner', [])
          missing_locks = [lock for lock in ('go.mod', os.environ['NODE_LOCKFILE']) if not any(lock in finding.get('Detail', '') for finding in osv_results)]
          validator_exit = int((root / 'validator.exit').read_text())
          tee_exit = int((root / 'tee.exit').read_text())
          complete = not missing and not missing_locks and not osv_scan_errors and all(value['completed'] >= value['required'] and value['started'] == value['completed'] for value in scanners.values())
          passed = validator_exit == 0 and tee_exit == 0 and not errors and complete
          summary = {'passed': passed, 'validator_exit': validator_exit, 'tee_exit': tee_exit,
                     'errors': errors, 'missing_analyzers': missing, 'missing_lockfiles': missing_locks, 'osv_scan_errors': osv_scan_errors, 'scanners': scanners,
                     'llm_review': 'No provider key supplied; optional default LLM review is not established by this preflight.'}
          (root / 'assessment.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          raise SystemExit(0 if passed else (validator_exit or tee_exit or 1))
          PY

      - name: Require exact main release candidate before attestation
        id: candidate_identity
        if: ${{ inputs.attest_candidate && steps.assessment.outcome == 'success' }}
        working-directory: build-source
        env:
          VALIDATION_SHA: ${{ inputs.validation_sha }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          [[ "$VERSION" == '1.1.2' ]] || { echo 'Only v1.1.2 may be attested'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$VALIDATION_SHA" ]] || { echo 'Source checkout changed'; exit 1; }
          [[ "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" == "$VALIDATION_SHA" ]] || { echo 'Source is not current main'; exit 1; }
          git diff --exit-code
          jq -e --arg sha "$VALIDATION_SHA" '.source_sha == $sha and .package_version == "1.1.2"' "$PREFLIGHT_ROOT/evidence/source.json"

      - name: Attest validated release candidate and evidence
        if: ${{ inputs.attest_candidate && steps.assessment.outcome == 'success' && steps.candidate_identity.outcome == 'success' }}
        id: candidate_attestation
        # GitHub provenance identifies the workflow commit. Attested source.json
        # separately records the actual source commit/tree built and validated.
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ env.PREFLIGHT_ROOT }}/evidence/${{ steps.source.outputs.archive }}
            ${{ env.PREFLIGHT_ROOT }}/evidence/${{ steps.source.outputs.archive }}.sha1
            ${{ env.PREFLIGHT_ROOT }}/evidence/${{ steps.source.outputs.archive }}.sha256
            ${{ env.PREFLIGHT_ROOT }}/evidence/source.json
            ${{ env.PREFLIGHT_ROOT }}/evidence/reports/validator.json

      - name: Save candidate attestation bundle
        if: ${{ inputs.attest_candidate && steps.candidate_attestation.outcome == 'success' }}
        env:
          BUNDLE_PATH: ${{ steps.candidate_attestation.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.candidate_attestation.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.candidate_attestation.outputs.attestation-url }}
        run: |
          [[ -s "$BUNDLE_PATH" ]]
          cp "$BUNDLE_PATH" "$PREFLIGHT_ROOT/evidence/candidate-attestation.json"
          jq -n --arg id "$ATTESTATION_ID" --arg url "$ATTESTATION_URL" '{id: $id, url: $url}' > "$PREFLIGHT_ROOT/evidence/candidate-attestation-receipt.json"

      - name: Upload signed archive, immutable source and full evidence
        if: ${{ always() && env.PREFLIGHT_ROOT != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: grafana-full-validation-${{ inputs.validation_sha }}
          path: ${{ env.PREFLIGHT_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 7
