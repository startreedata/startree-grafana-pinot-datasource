name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

run-name: Release (${{ inputs.version_bump }}) from ${{ github.ref_name }} by @${{ github.actor }}

jobs:
  test_frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        run: yarn run test:ci

  test_backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: repo.startreedata.io/startree-docker-registry
          username: ${{ secrets.MVN_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.MVN_ARTIFACTORY_TOKEN }}

      - name: Start Pinot
        run: docker compose up pinot --quiet-pull --detach

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - name: Setup Pinot
        run: go run cmd/testsetup/main.go

      - name: Run backend tests
        run: go test -p 1 -v ./...

      - name: Collect Pinot logs
        if: ${{ failure() }}
        run: docker compose logs pinot > pinot.log

      - name: Upload Pinot logs
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: pinot-logs
          path: pinot.log
          retention-days: 30

  build_plugin:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - run: go run cmd/release/main.go build_backend
      - run: yarn install --frozen-lockfile
      - run: yarn run build

      - run: tar cf dist.tar dist

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: dist.tar
          path: dist.tar
          retention-days: 1

  end_to_end:
    name: Test E2E
    runs-on: ubuntu-latest
    needs: [build_plugin]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: repo.startreedata.io/startree-docker-registry
          username: ${{ secrets.MVN_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.MVN_ARTIFACTORY_TOKEN }}

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Download plugin
        uses: actions/download-artifact@v4
        with:
          name: dist.tar

      - run: tar xf dist.tar

      - name: Start Grafana
        run: docker compose up grafana --wait

      - name: Install Playwright Browsers
        run: yarn install --frozen-lockfile && yarn playwright install --with-deps chromium

      - name: Run Playwright tests
        run: yarn playwright test --reporter github
        env:
          PINOT_CONNECTION_CONTROLLER_URL: ${{ secrets.E2E_PINOT_CONNECTION_CONTROLLER_URL }}
          PINOT_CONNECTION_BROKER_URL: ${{ secrets.E2E_PINOT_CONNECTION_BROKER_URL }}
          PINOT_CONNECTION_DATABASE: ${{ secrets.E2E_PINOT_CONNECTION_DATABASE }}
          PINOT_CONNECTION_AUTH_TOKEN: ${{ secrets.E2E_PINOT_CONNECTION_AUTH_TOKEN }}

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results (videos, traces, screenshots)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

      - name: Collect Grafana logs
        if: ${{ failure() }}
        run: docker compose logs grafana > grafana.log

      - name: Upload Grafana logs
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: grafana-logs
          path: grafana.log
          retention-days: 30

  release:
    name: Build & Release
    needs: [test_frontend, test_backend, end_to_end]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read go version from go.mod
        id: go_version
        run: echo "GO_VERSION=$(grep '^go ' go.mod | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go_version.outputs.GO_VERSION }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          git config --global user.email "ci@startree.ai"
          git config --global user.name "CI"
          if [ "${{ github.ref_name }}" = "main" ]; then
            version=$(npm version ${{ inputs.version_bump }})
            git push --follow-tags
          else
            sanitized_branch=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
            npm version --no-git-tag-version ${{ inputs.version_bump }}
            base_version=$(node -p "require('./package.json').version")
            version="v${base_version}-${sanitized_branch}"
            git add package.json
            git commit -m "$version"
            git tag -a "$version" -m "$version"
            git push origin HEAD "$version"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build backend
        run: go run cmd/release/main.go build_backend

      - name: Build frontend
        run: yarn run build

      - name: Get plugin metadata
        id: metadata
        run: |
          GRAFANA_PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          GRAFANA_PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          echo "plugin-id=${GRAFANA_PLUGIN_ID}" >> $GITHUB_OUTPUT
          echo "plugin-version=${GRAFANA_PLUGIN_VERSION}" >> $GITHUB_OUTPUT
          echo "archive=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip" >> $GITHUB_OUTPUT
          echo "archive-sha1sum=${GRAFANA_PLUGIN_ID}-${GRAFANA_PLUGIN_VERSION}.zip.sha1" >> $GITHUB_OUTPUT

      - name: Sign plugin
        run: yarn run sign
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN_FOR_SIGNING }}

      - name: Package plugin
        run: |
          mv dist ${{ steps.metadata.outputs.plugin-id }}
          zip ${{ steps.metadata.outputs.archive }} ${{ steps.metadata.outputs.plugin-id }} -r
          sha1sum ${{ steps.metadata.outputs.archive }} | cut -f1 -d' ' > ${{ steps.metadata.outputs.archive-sha1sum }}

      - name: Validate plugin
        run: npx -y @grafana/plugin-validator@latest -sourceCodeUri file://./ ${{ steps.metadata.outputs.archive }}

      - name: Generate artifact attestation
        id: attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.metadata.outputs.archive }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./${{ steps.metadata.outputs.archive }}
            ./${{ steps.metadata.outputs.archive-sha1sum }}

      # Intentionally no post-release "prepare for next development version" step.
      # plugin.json's version is resolved from package.json at webpack build time via the
      # %VERSION% placeholder, so a prerelease bump on main between releases creates a
      # version on main for which no plugin.json or built artifact exists. The Grafana
      # plugin marketplace validator flags this as a packagecode-version-mismatch.
      # Keeping main pinned to the last released version makes the next release's
      # `npm version <bump>` step (above) the single source of truth for version changes.
