name: Create Customer Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: A single word description for this release, e.g. graphiant.
        required: true
      root_urls:
        description: Comma-separated root urls of the intended Grafana instance, e.g. https://grafana.envId.orgId.startree.cloud.
        required: true
      version:
        description: Internal artifact version to re-sign (optional v prefix). Empty uses the latest Git tag.
        required: false
        type: string

run-name: Publish release for ${{ inputs.release_name }} triggered by @${{ github.actor }}

permissions: read-all

jobs:
  build:
    name: Create Customer Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Sign release
        run: go run cmd/release/main.go resign "$ROOT_URLS"
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_VERSION: ${{ inputs.version }}
          ROOT_URLS: ${{ inputs.root_urls }}
