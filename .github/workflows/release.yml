# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  workflow_dispatch:
    inputs:
      newVersion:
        type: choice
        description: New version is
        options:
          - patch
          - minor
          - major

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Admin-capable token (PAT or GitHub App) so the version-bump commit can be
          # pushed to protected main. The default GITHUB_TOKEN is neither admin nor in
          # main's push allowlist, so its push is rejected (GH006 / required checks).
          # enforce_admins=false on main means an admin token bypasses protection.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install node dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Login in Docker registry
        uses: docker/login-action@v4
        with:
          registry: repo.startreedata.io/startree-docker-registry
          username: ${{ secrets.MVN_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.MVN_ARTIFACTORY_TOKEN }}

      - name: Bump the release version
        id: version
        run: |
          git config --global user.email "ci@startree.ai"
          git config --global user.name "CI"
          version=$(npm version ${{ github.event.inputs.newVersion }})
          git push --follow-tags
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Build & upload the release
        run: go run cmd/release/main.go create
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Publish startree-grafana image
        uses: docker/build-push-action@v6
        with:
          file: startree-cloud/Dockerfile
          context: .
          push: true
          tags: |
            repo.startreedata.io/startree-docker-registry/startree-grafana:${{ steps.version.outputs.version }}
            repo.startreedata.io/startree-docker-registry/startree-grafana:latest

      # Intentionally no post-release "prepare for next version" step.
      # plugin.json uses a %VERSION% placeholder resolved from package.json at build time,
      # so any package.json bump on main between releases would make main report a version
      # for which no plugin.json/built artifact exists, which the Grafana plugin validator
      # flags as a version mismatch. Keeping main pinned to the last released version means
      # the next release's `npm version <bump>` step (line 52) is the single source of truth.
